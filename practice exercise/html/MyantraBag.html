<!DOCTYPE html>
<html lang="en">
<head>
    <title>Myantra Bag</title>
    <link rel="stylesheet" href="/JS_learning/practice exercise/css/MyantraBag.css">
</head>
<body>
    <button class="button1" id="button1" onclick="cartQuantity++;document.querySelector('#cart-summary').innerText=`Your Bag has ${cartQuantity} item`;" >Add to Bag</button>
    <button class="button2" id="button2" onclick="cartQuantity--;document.querySelector('#cart-summary').innerText=`Your Bag has ${cartQuantity} item`;">Move to Wishlist</button>
    <button class="button1" id="button3" onclick="cartQuantity=cartQuantity+2;document.querySelector('#cart-summary').innerText=`Your Bag has ${cartQuantity} item`;">Add 1+1 Sale Item</button>

    <h1 id="cart-summary">Your Bag has item</h1>

    <script src="/JS_learning/practice exercise/js/MyantraBag.js"></script>
</body>
</html>
