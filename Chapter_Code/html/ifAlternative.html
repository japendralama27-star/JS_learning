<!DOCTYPE html>
<html lang="en">
<head>
    <title>if alternative</title>
</head>
<body>
    <script>
        //ternary operator
        let age = 12;
        age >= 18 ? console.log("You are an adult.") : console.log("You are a minor.");

        //guard operator
        // let a;//a=age
        // let finalAge= a || 42;
        // console.log(finalAge);


        //default operator
         let a;//a=age
        let finalAge= a ?? 42;
        console.log(finalAge);
    </script>
</body>
</html>
